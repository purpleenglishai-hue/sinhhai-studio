<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinhHai-Studio | Canva-like Image Editor & AI Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js CDN cho Canvas Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/531/fabric.min.js"></script>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Top Header Bar -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-3 py-1 rounded-lg font-bold text-lg flex items-center shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> SinhHai-Studio
            </div>
            <span class="text-xs bg-slate-700 text-purple-300 px-2 py-0.5 rounded border border-purple-500/30">MIT Studio</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="downloadImage('png')" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-1.5 rounded transition flex items-center">
                <i class="fa-solid fa-download mr-1.5"></i> Xuất PNG
            </button>
            <button onclick="downloadImage('svg')" class="bg-indigo-600 hover:bg-indigo-500 text-sm px-3 py-1.5 rounded transition font-medium flex items-center shadow">
                <i class="fa-solid fa-file-code mr-1.5"></i> Xuất SVG/ICO
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Công cụ & Tài nguyên -->
        <aside class="w-80 bg-slate-800/90 border-r border-slate-700 flex flex-col z-10">
            <!-- Tabs Menu -->
            <div class="flex border-b border-slate-700 text-xs font-medium text-center">
                <button onclick="switchTab('ai')" id="btn-tab-ai" class="flex-1 py-3 text-purple-400 border-b-2 border-purple-500 bg-slate-800"><i class="fa-solid fa-robot mr-1"></i> AI SinhHai</button>
                <button onclick="switchTab('resources')" id="btn-tab-resources" class="flex-1 py-3 text-slate-400 hover:text-white"><i class="fa-solid fa-shapes mr-1"></i> Kho Miễn Phí</button>
                <button onclick="switchTab('text')" id="btn-tab-text" class="flex-1 py-3 text-slate-400 hover:text-white"><i class="fa-solid fa-font mr-1"></i> Chữ & Text</button>
            </div>

            <!-- Nội dung Tab: AI SinhHai -->
            <div id="tab-ai" class="p-4 flex-1 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nhập Prompt tạo ảnh/vector</label>
                    <textarea id="ai-prompt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" placeholder="Mô tả ý tưởng hình ảnh, logo, vector của bạn..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Kích thước chuẩn (Aspect Ratio)</label>
                    <select id="ai-ratio" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-purple-500">
                        <option value="1:1">Vuông (1:1 - 1024x1024)</option>
                        <option value="2:3">Dọc (2:3 - 800x1200)</option>
                        <option value="16:9">Ngang (16:9 - 1280x720)</option>
                    </select>
                </div>
                <button onclick="generateAIImage()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-2.5 rounded shadow transition flex items-center justify-center">
                    <i class="fa-solid fa-bolt mr-2"></i> Tạo Ảnh/Vector AI
                </button>
                <div class="pt-2 border-t border-slate-700">
                    <p class="text-xs text-slate-400 mb-2">Gợi ý mẫu nhanh:</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setPrompt('Modern tech startup logo, minimalist vector')" class="text-left bg-slate-900 hover:bg-slate-700 p-2 rounded text-xs border border-slate-700 truncate">Logo Công Nghệ</button>
                        <button onclick="setPrompt('Cute flat vector icon, transparent background')" class="text-left bg-slate-900 hover:bg-slate-700 p-2 rounded text-xs border border-slate-700 truncate">Icon Vector Flat</button>
                    </div>
                </div>
            </div>

            <!-- Nội dung Tab: Kho Tài Nguyên -->
            <div id="tab-resources" class="p-4 flex-1 overflow-y-auto hidden space-y-3">
                <p class="text-xs text-slate-400">Chọn chèn nhanh các hình khối & tài nguyên vector miễn phí:</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addShape('rect')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-square text-lg mb-1 text-purple-400"></i> Hình Chữ Nhật</button>
                    <button onclick="addShape('circle')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-circle text-lg mb-1 text-indigo-400"></i> Hình Tròn</button>
                    <button onclick="addShape('triangle')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-solid fa-play rotate-[-30deg] text-lg mb-1 text-pink-400"></i> Tam Giác</button>
                    <button onclick="addSampleImage()" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-image text-lg mb-1 text-emerald-400"></i> Chèn Mẫu Ảnh</button>
                </div>
            </div>

            <!-- Nội dung Tab: Chữ & Text -->
            <div id="tab-text" class="p-4 flex-1 overflow-y-auto hidden space-y-3">
                <button onclick="addText('Tiêu đề chính', 28, true)" class="w-full bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-sm font-bold text-left flex items-center justify-between">
                    <span>Thêm Tiêu Đề Lớn</span> <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <button onclick="addText('Đoạn văn bản nội dung...', 16, false)" class="w-full bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-sm text-left flex items-center justify-between">
                    <span>Thêm Đoạn Văn Bản</span> <i class="fa-solid fa-plus text-xs"></i>
                </button>
            </div>
        </aside>

        <!-- Khu vực Canvas trung tâm -->
        <main class="flex-1 bg-slate-950 flex items-center justify-center relative overflow-hidden p-8">
            <div class="bg-white shadow-2xl rounded overflow-hidden">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>
        </main>
    </div>

    <!-- JavaScript xử lý Canvas & Giao diện -->
    <script>
        // Khởi tạo Fabric Canvas
        const canvas = new fabric.Canvas('canvas', {
            backgroundColor: '#ffffff'
        });

        // Thêm mặc định một chữ chào mừng
        const text = new fabric.Textbox('Chào mừng đến với SinhHai-Studio', {
            left: 200,
            top: 250,
            fontSize: 24,
            fill: '#4f46e5',
            fontFamily: 'Arial'
        });
        canvas.add(text);
        canvas.setActiveObject(text);

        // Chuyển Tab Sidebar
        function switchTab(tabName) {
            ['ai', 'resources', 'text'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-tab-' + t).className = "flex-1 py-3 text-slate-400 hover:text-white";
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-tab-' + tabName).className = "flex-1 py-3 text-purple-400 border-b-2 border-purple-500 bg-slate-800";
        }

        function setPrompt(text) {
            document.getElementById('ai-prompt').value = text;
        }

        // Thêm hình khối
        function addShape(type) {
            if (type === 'rect') {
                const rect = new fabric.Rect({ left: 100, top: 100, fill: '#818cf8', width: 120, height: 80, rx: 5, ry: 5 });
                canvas.add(rect);
                canvas.setActiveObject(rect);
            } else if (type === 'circle') {
                const circle = new fabric.Circle({ left: 150, top: 150, fill: '#f472b6', radius: 50 });
                canvas.add(circle);
                canvas.setActiveObject(circle);
            } else if (type === 'triangle') {
                const triangle = new fabric.Triangle({ left: 200, top: 150, fill: '#34d399', width: 90, height: 90 });
                canvas.add(triangle);
                canvas.setActiveObject(triangle);
            }
        }

        function addText(content, size, isBold) {
            const txt = new fabric.Textbox(content, {
                left: 250,
                top: 250,
                fontSize: size,
                fontWeight: isBold ? 'bold' : 'normal',
                fill: '#1e293b'
            });
            canvas.add(txt);
            canvas.setActiveObject(txt);
        }

        function addSampleImage() {
            fabric.Image.fromURL('https://picsum.photos/400/300', function(img) {
                img.scaleToWidth(250);
                canvas.add(img);
                canvas.centerObject(img);
                canvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' });
        }

        // Gọi API AI SinhHai (Endpoint mẫu chuẩn kết nối sinhhai.com)
        async function generateAIImage() {
            const prompt = document.getElementById('ai-prompt').value;
            const ratio = document.getElementById('ai-ratio').value;
            if (!prompt) {
                alert('Vui lòng nhập nội dung prompt!');
                return;
            }

            alert(`Đang gửi yêu cầu tạo ảnh đến API SinhHai (sinhhai.com) với prompt: "${prompt}" (Tỉ lệ: ${ratio})...`);
            
            // Giả lập kết quả trả về từ API AI SinhHai và chèn trực tiếp lên Canvas
            setTimeout(() => {
                fabric.Image.fromURL('https://picsum.photos/500/500', function(img) {
                    img.scaleToWidth(300);
                    canvas.add(img);
                    canvas.centerObject(img);
                    canvas.setActiveObject(img);
                    alert('Đã tạo và chèn ảnh AI thành công vào Studio!');
                }, { crossOrigin: 'anonymous' });
            }, 1000);
        }

        // Xuất file
        function downloadImage(format) {
            if (format === 'png') {
                const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
                const link = document.createElement('a');
                link.download = 'sinhhai-studio-artwork.png';
                link.href = dataURL;
                link.click();
            } else if (format === 'svg') {
                const svgData = canvas.toSVG();
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'sinhhai-studio-artwork.svg';
                link.href = url;
                link.click();
            }
        }
    </script>
</body>
</html>
