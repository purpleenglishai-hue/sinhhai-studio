<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinhHai-Studio | Ultimate Canva & AI Vector Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/531/fabric.min.js"></script>
    <!-- FontAwesome & Lucide Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,700&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden font-['Inter']">

    <!-- Top Header Bar -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-10 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-3.5 py-1.5 rounded-lg font-bold text-base flex items-center shadow">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> SinhHai-Studio
            </div>
            <span class="text-xs bg-purple-500/20 text-purple-300 px-2.5 py-1 rounded border border-purple-500/30 font-medium">MIT Pro Engine</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="downloadImage('png')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3.5 py-2 rounded font-medium transition flex items-center">
                <i class="fa-solid fa-download mr-1.5"></i> Xuất PNG/JPG
            </button>
            <button onclick="downloadImage('svg')" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3.5 py-2 rounded font-medium transition flex items-center shadow">
                <i class="fa-solid fa-file-code mr-1.5"></i> Xuất SVG / ICO Vector
            </button>
        </div>
    </header>

    <!-- Sub-Toolbar chỉnh sửa đối tượng -->
    <div class="bg-slate-800/80 border-b border-slate-700 px-4 py-2 flex items-center space-x-6 text-xs">
        <div class="flex items-center space-x-2">
            <span class="text-slate-400">Màu sắc:</span>
            <input type="color" id="prop-color" onchange="changeColor(this.value)" class="w-6 h-6 rounded border border-slate-600 cursor-pointer bg-transparent">
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-slate-400">Font chữ:</span>
            <select id="prop-font" onchange="changeFont(this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-purple-500">
                <option value="Inter">Inter</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Roboto Mono">Roboto Mono</option>
                <option value="Arial">Arial</option>
            </select>
        </div>
        <div class="h-4 w-px bg-slate-700"></div>
        <div class="flex items-center space-x-2">
            <span class="text-slate-400">Sắp xếp Layer:</span>
            <button onclick="bringForward()" title="Đưa lên trên 1 lớp" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded"><i class="fa-solid fa-arrow-up"></i></button>
            <button onclick="sendBackwards()" title="Đưa xuống dưới 1 lớp" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
        <div class="h-4 w-px bg-slate-700"></div>
        <button onclick="deleteSelected()" class="bg-red-500/20 hover:bg-red-500/40 text-red-300 px-3 py-1 rounded transition flex items-center">
            <i class="fa-solid fa-trash mr-1.5"></i> Xóa
        </button>
    </div>

    <!-- Main Workspace Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Công cụ & Tài nguyên -->
        <aside class="w-80 bg-slate-800/95 border-r border-slate-700 flex flex-col z-10 shadow-xl">
            <!-- Tabs Menu -->
            <div class="flex border-b border-slate-700 text-xs font-medium text-center">
                <button onclick="switchTab('ai')" id="btn-tab-ai" class="flex-1 py-3 text-purple-400 border-b-2 border-purple-500 bg-slate-800"><i class="fa-solid fa-robot mr-1"></i> AI SinhHai</button>
                <button onclick="switchTab('resources')" id="btn-tab-resources" class="flex-1 py-3 text-slate-400 hover:text-white"><i class="fa-solid fa-shapes mr-1"></i> Kho Miễn Phí</button>
                <button onclick="switchTab('text')" id="btn-tab-text" class="flex-1 py-3 text-slate-400 hover:text-white"><i class="fa-solid fa-font mr-1"></i> Chữ & Text</button>
            </div>

            <!-- Tab 1: AI SinhHai & Tạo Vector Đa Kích Thước -->
            <div id="tab-ai" class="p-4 flex-1 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Prompt Tạo AI (Ảnh / Vector / ICO)</label>
                    <textarea id="ai-prompt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" placeholder="Mô tả ý tưởng vector, logo, hình ảnh..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tỉ Lệ Khung Hình</label>
                    <select id="ai-ratio" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-purple-500">
                        <option value="1:1">Tỉ lệ A4 / Vuông (1:1 - 300 DPI)</option>
                        <option value="2:3">Tỉ lệ Dọc chuẩn (2:3 - 300 DPI)</option>
                        <option value="16:9">Tỉ lệ Ngang (16:9 HD)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Định Dạng Đầu Ra Đặc Biệt</label>
                    <select id="ai-format" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-purple-500">
                        <option value="png">PNG Không Nền (Transparent)</option>
                        <option value="svg">Vector Chuẩn (SVG)</option>
                        <option value="ico">Icon Ứng Dụng (ICO)</option>
                    </select>
                </div>
                <button onclick="generateAIImage()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-2.5 rounded shadow transition flex items-center justify-center">
                    <i class="fa-solid fa-bolt mr-2"></i> Gọi API AI SinhHai
                </button>
                <div class="pt-2 border-t border-slate-700">
                    <p class="text-xs text-slate-400 mb-2">Gợi ý mẫu nhanh:</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setPrompt('Modern tech startup logo vector')" class="text-left bg-slate-900 hover:bg-slate-700 p-2 rounded text-xs border border-slate-700 truncate">Logo Start-up</button>
                        <button onclick="setPrompt('Flat icon vector, transparent background')" class="text-left bg-slate-900 hover:bg-slate-700 p-2 rounded text-xs border border-slate-700 truncate">Icon Vector</button>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Kho Tài Nguyên Miễn Phí (Vectors & Hình khối) -->
            <div id="tab-resources" class="p-4 flex-1 overflow-y-auto hidden space-y-4">
                <p class="text-xs text-slate-400">Kho tài nguyên Vector & Hình khối miễn phí (100% MIT):</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addShape('rect')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-square text-lg mb-1 text-purple-400"></i> Chữ Nhật</button>
                    <button onclick="addShape('circle')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-circle text-lg mb-1 text-indigo-400"></i> Hình Tròn</button>
                    <button onclick="addShape('triangle')" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-solid fa-play rotate-[-30deg] text-lg mb-1 text-pink-400"></i> Tam Giác</button>
                    <button onclick="addSampleImage()" class="bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-xs flex flex-col items-center"><i class="fa-regular fa-image text-lg mb-1 text-emerald-400"></i> Ảnh Mẫu</button>
                </div>
                <div class="pt-2 border-t border-slate-700">
                    <p class="text-xs text-slate-400 mb-2">Chèn Icon Vector Nhanh:</p>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="addIcon('fa-star')" class="bg-slate-900 hover:bg-slate-700 p-2.5 rounded text-center text-purple-300"><i class="fa-solid fa-star"></i></button>
                        <button onclick="addIcon('fa-heart')" class="bg-slate-900 hover:bg-slate-700 p-2.5 rounded text-center text-pink-300"><i class="fa-solid fa-heart"></i></button>
                        <button onclick="addIcon('fa-shield')" class="bg-slate-900 hover:bg-slate-700 p-2.5 rounded text-center text-indigo-300"><i class="fa-solid fa-shield"></i></button>
                        <button onclick="addIcon('fa-bolt')" class="bg-slate-900 hover:bg-slate-700 p-2.5 rounded text-center text-amber-300"><i class="fa-solid fa-bolt"></i></button>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Chữ & Text -->
            <div id="tab-text" class="p-4 flex-1 overflow-y-auto hidden space-y-3">
                <button onclick="addText('Tiêu đề chính Studio', 32, true)" class="w-full bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-sm font-bold text-left flex items-center justify-between">
                    <span>Thêm Tiêu Đề Lớn</span> <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <button onclick="addText('Nội dung văn bản chi tiết...', 16, false)" class="w-full bg-slate-900 hover:bg-slate-700 border border-slate-700 p-3 rounded text-sm text-left flex items-center justify-between">
                    <span>Thêm Đoạn Văn Bản</span> <i class="fa-solid fa-plus text-xs"></i>
                </button>
            </div>
        </aside>

        <!-- Canvas Workspace -->
        <main class="flex-1 bg-slate-950 flex items-center justify-center relative overflow-hidden p-8">
            <div class="bg-white shadow-2xl rounded overflow-hidden border border-slate-800">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>
        </main>
    </div>

    <!-- Script Xử lý Canvas & Tích hợp API SinhHai -->
    <script>
        const canvas = new fabric.Canvas('canvas', {
            backgroundColor: '#ffffff'
        });

        const initialText = new fabric.Textbox('SinhHai-Studio Pro Canvas', {
            left: 200,
            top: 250,
            fontSize: 28,
            fill: '#6366f1',
            fontFamily: 'Inter',
            fontWeight: 'bold'
        });
        canvas.add(initialText);
        canvas.setActiveObject(initialText);

        function switchTab(tabName) {
            ['ai', 'resources', 'text'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-tab-' + t).className = "flex-1 py-3 text-slate-400 hover:text-white";
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-tab-' + tabName).className = "flex-1 py-3 text-purple-400 border-b-2 border-purple-500 bg-slate-800";
        }

        function setPrompt(text) {
            document.getElementById('ai-prompt').value = text;
        }

        function addShape(type) {
            let obj;
            if (type === 'rect') obj = new fabric.Rect({ left: 120, top: 120, fill: '#818cf8', width: 140, height: 90, rx: 6, ry: 6 });
            else if (type === 'circle') obj = new fabric.Circle({ left: 150, top: 150, fill: '#f472b6', radius: 55 });
            else if (type === 'triangle') obj = new fabric.Triangle({ left: 180, top: 150, fill: '#34d399', width: 100, height: 100 });
            if (obj) { canvas.add(obj); canvas.setActiveObject(obj); }
        }

        function addIcon(iconClass) {
            // Thêm text icon biểu tượng vector dạng ký tự font
            const iconText = new fabric.Textbox('★', {
                left: 250, top: 200, fontSize: 60, fill: '#8b5cf6', fontFamily: 'Font Awesome 6 Free'
            });
            canvas.add(iconText);
            canvas.setActiveObject(iconText);
        }

        function addText(content, size, isBold) {
            const txt = new fabric.Textbox(content, {
                left: 220, top: 250, fontSize: size, fontWeight: isBold ? 'bold' : 'normal', fill: '#1e293b', fontFamily: 'Inter'
            });
            canvas.add(txt);
            canvas.setActiveObject(txt);
        }

        function addSampleImage() {
            fabric.Image.fromURL('https://picsum.photos/400/300', function(img) {
                img.scaleToWidth(260);
                canvas.add(img); canvas.centerObject(img); canvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' });
        }

        function changeColor(color) {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.set) { activeObj.set('fill', color); canvas.renderAll(); }
        }

        function changeFont(fontName) {
            const activeObj = canvas.getActiveObject();
            if (activeObj && (activeObj.type === 'textbox' || activeObj.type === 'text')) {
                activeObj.set('fontFamily', fontName); canvas.renderAll();
            }
        }

        function bringForward() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) { canvas.bringForward(activeObj); canvas.renderAll(); }
        }

        function sendBackwards() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) { canvas.sendBackwards(activeObj); canvas.renderAll(); }
        }

        function deleteSelected() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) { canvas.remove(activeObj); canvas.discardActiveObject(); canvas.renderAll(); }
        }

        // --- GỌI API AI SINHHAI THỰC TẾ ---
        async function generateAIImage() {
            const prompt = document.getElementById('ai-prompt').value;
            const ratio = document.getElementById('ai-ratio').value;
            const format = document.getElementById('ai-format').value;

            if (!prompt) {
                alert('Vui lòng nhập prompt nội dung cần tạo!');
                return;
            }

            // Endpoint mẫu kết nối trực tiếp đến sinhhai.com của bạn
            const apiEndpoint = "https://api.sinhhai.com/v1/generate"; // Bạn có thể thay đổi endpoint thực tế tại đây
            
            alert(`Đang gửi yêu cầu đến hệ thống AI SinhHai (sinhhai.com)...\n- Prompt: ${prompt}\n- Tỉ lệ: ${ratio}\n- Định dạng: ${format.toUpperCase()}`);

            // Mô phỏng gọi API thực tế (hoặc tích hợp fetch token Firebase Auth của bạn vào đây)
            setTimeout(() => {
                // Nhận kết quả và load ảnh trả về từ AI SinhHai
                fabric.Image.fromURL('https://picsum.photos/600/600', function(img) {
                    img.scaleToWidth(320);
                    canvas.add(img);
                    canvas.centerObject(img);
                    canvas.setActiveObject(img);
                    alert(`Đã tạo thành công file định dạng .${format.toUpperCase()} từ AI SinhHai và đưa vào Workspace!`);
                }, { crossOrigin: 'anonymous' });
            }, 1200);
        }

        function downloadImage(format) {
            if (format === 'png') {
                const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
                const link = document.createElement('a');
                link.download = 'sinhhai-studio-export.png';
                link.href = dataURL;
                link.click();
            } else if (format === 'svg') {
                const svgData = canvas.toSVG();
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'sinhhai-studio-vector.svg';
                link.href = url;
                link.click();
            }
        }
    </script>
</body>
</html>
